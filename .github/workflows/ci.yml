# Minimal CI. Written 2026-09-09 because this repo had NO CI at all, which meant:
#   - six Dependabot PRs sat unevaluable, and the daily digest could only mark them "[none]"
#   - `npm run lint` had been failing on main for weeks with nothing to report it
#   - evidence had to be produced by hand (root-config scripts/ops/pr-evidence.sh)
#
# `build` and `lint` are both blocking gates.
#
# 2026-09-14 (kanban t_9778dac9): lint is green again. It was broken by two independent,
# unrelated causes that had both accumulated silently because there was no CI to catch them:
#   1. typescript was pinned to ^7, but no published typescript-eslint (as of 8.70.0) supports
#      TS 7 (peerDependencies caps at <6.1.0). Fixed by pinning typescript to ^6.0.3, the
#      newest 6.x release, still inside that range.
#   2. A separate Dependabot PR bumped eslint 9 -> 10 and merged on "build passes" alone
#      (lint was already broken for reason 1, so nobody saw it break lint too). eslint-plugin-react
#      7.37.5, bundled transitively by eslint-config-next, only supports eslint up to ^9.7 and
#      crashes under ESLint 10's flat-config API. Fixed by pinning eslint back to ^9.39.5.
# Revisit both pins when typescript-eslint publishes TS 7 support and eslint-plugin-react
# publishes ESLint 10 support, respectively.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
